[alias]
# Generate dynamic Rust into crates/spec/volar-spec-dyn/src/generated.rs
# (the `volar-codegen` binary's own default for the `dyn` target).
generate-spec = [
    "run",
    "--package", "volar-compiler-passes",
    "--bin", "volar-codegen",
    "--features", "parsing",
    "--",
    "dyn",
]

# Generate TypeScript into packages/volar-spec-ts/generated.ts
# (the `volar-codegen` binary's own default for the `ts` target).
generate-ts = [
    "run",
    "--package", "volar-compiler-passes",
    "--bin", "volar-codegen",
    "--features", "parsing",
    "--",
    "ts",
]

# `cargo xtask <subcommand>` — regenerate/check the derived spec files listed
# in xtask/src/main.rs (gen-specs / check-specs). Without this alias,
# `cargo xtask ...` fails with "no such command" and CI's check-generated job
# (which runs `cargo xtask check-specs`) cannot run at all.
xtask = ["run", "--package", "xtask", "--"]

# xtask/git self-deps: build the workspace's volar-compiler from THIS
# worktree (otherwise Cargo.lock's pinned rev silently shadows local
# printer changes, and checked-in generated files diverge from CI's
# HEAD-resolved builds).
[patch."https://github.com/portal-co/volar.git"]
volar-compiler = { path = "/private/tmp/volar-dev/volar/crates/compiler/volar-compiler" }
volar-compiler-passes = { path = "/private/tmp/volar-dev/volar/crates/compiler/volar-compiler-passes" }
volar-compiler-common = { path = "/private/tmp/volar-dev/volar/crates/compiler/volar-compiler-common" }
