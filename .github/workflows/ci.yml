name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Fast typecheck ──────────────────────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude xtask

  # ── Full test suite ─────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `crates/compiler/volar-compiler-passes/tests/ts_backend*.rs` shell out
      # to `<repo>/node_modules/.bin/tsc`. Without this step those tests panic
      # with "tsc not found" on a clean checkout instead of exercising the TS
      # backend's strict-mode typecheck — see
      # docs/ts-emitter-length-params-and-solidity-backend-plan.md §1.3.5.
      - run: npm ci
      # Runtime smoke test for the width-aware wrapping helpers (part of the
      # npm-side test surface alongside the tsc-strict checks; keeps
      # helpers.ts runtime semantics gated, not just typechecked).
      - run: npm test --workspace @portal-solutions/volar-runtime
      - run: cargo test --workspace --exclude xtask

  # ── Generated-file freshness check ─────────────────────────────────────────
  check-generated:
    name: Check generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate derived specs
        run: cargo xtask check-specs
      - name: Fail if any generated file is stale
        run: |
          git diff --exit-code \
            crates/compiler/volar-compiler/volar_ts_generated.ts \
            crates/compiler/volar-compiler/volar_dyn_generated.rs \
            crates/spec/volar-spec-dyn/src/generated.rs \
            packages/volar-spec-ts/generated.ts
