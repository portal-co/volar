[package]
name = "volar-verifier-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Prove-the-verifier integration: runtime execution of the woven verifier (compile+run real Rust) and the fold-driving harness over volar-fold"
repository.workspace = true

[dependencies]
volar-fold = { path = "../volar-fold" }
volar-spec = { path = "../../spec/volar-spec" }
volar-discipline = { workspace = true }
hybrid-array = { version = "0.4.8", default-features = false }
cipher = { version = "0.5.1", default-features = false }
