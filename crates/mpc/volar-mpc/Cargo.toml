[package]
name = "volar-mpc"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Two-party garbled-circuit MPC session layer for Volar (semi-honest)"
repository.workspace = true

[dependencies]
volar-spec = { git = "https://github.com/portal-co/volar.git" }
hybrid-array.workspace = true
digest.workspace = true
sha2 = { version = "0.11.0-rc.0", default-features = false }
ml-kem = { version = "0.3.2", default-features = false, optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
sha2 = { version = "0.11.0-rc.0", default-features = false }
typenum = { version = "1.17", default-features = false }

[features]
default = []
# Framed-TCP transport + std-only helpers. The crate is no_std+alloc by default.
std = []
# ML-KEM-1024 1-of-2 OT (post-quantum KEM-based), an alternative to the
# default Chou-Orlandi base OT. No extra std requirement.
mlkem = ["dep:ml-kem", "dep:rand_core"]
