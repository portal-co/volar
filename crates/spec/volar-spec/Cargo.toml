[package]
name = "volar-spec"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
multi_party = []
# Enables the insecure in-process BitGC equation/driver used only by reference
# adapters and correctness tests. It is not a protected-session profile.
bitgc-reference = []

[dependencies]
cipher.workspace = true
digest.workspace = true
sha3.workspace = true
hybrid-array.workspace = true
elliptic-curve = {workspace = true,features = ["arithmetic"]}
volar-primitives = { git = "https://github.com/portal-co/volar.git" }
volar-common = { git = "https://github.com/portal-co/volar.git" }

[dev-dependencies]
proptest = "1"
sha2 = { version = "0.11.0-rc.0", default-features = false }

[[test]]
name = "bitgc_bench"
path = "tests/bitgc_bench.rs"
required-features = ["bitgc-reference"]

[[test]]
name = "bitgc_sub64_conformance"
path = "tests/bitgc_sub64_conformance.rs"
required-features = ["bitgc-reference"]