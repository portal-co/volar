[package]
name = "volar-c-backend-spec-tests"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Spec-integration and volar-lir-codegen-dependent tests for volar-c-backend, kept in volar since they exercise volar-compiler/volar-spec, not just the LIR-to-C backend"
repository.workspace = true
publish = false

[dependencies]
volar-c-backend = { git = "https://github.com/portal-co/volar-ir" }
volar-compiler = { git = "https://github.com/portal-co/volar.git", features = ["parsing"] }
volar-lir-codegen = { git = "https://github.com/portal-co/volar.git" }
volar-weaver = { git = "https://github.com/portal-co/volar.git" }
volar-wasm-backend = { git = "https://github.com/portal-co/volar-ir" }
volar-lir = { git = "https://github.com/portal-co/volar-ir" }
volar-lir-saved = { git = "https://github.com/portal-co/volar-ir" }
volar-lir-test-corpus = { git = "https://github.com/portal-co/volar-ir" }
volar-ir = { git = "https://github.com/portal-co/volar-ir" }
volar-ir-passes = { git = "https://github.com/portal-co/volar-ir" }
wasmtime = "46.0.1"
