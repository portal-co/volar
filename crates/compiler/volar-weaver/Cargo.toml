[package]
name = "volar-weaver"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
# Enable parsing-based spec linkage (makes weave output self-contained).
linking = ["volar-compiler/parsing"]
rkyv = ["volar-compiler/rkyv", "volar-ir-common/rkyv", "volar-side/rkyv"]
# Enable the network-protocol weaving pass (volar_net::VoleTransport interface).
net = ["dep:volar-net"]

[dependencies]
volar-compiler = {git = "https://github.com/portal-co/volar.git"}
volar-compiler-common ={git = "https://github.com/portal-co/volar.git"}
volar-discipline = { workspace = true }
volar-provenance.workspace = true
volar-ir-common.workspace = true
volar-side.workspace = true
volar-ir.workspace = true
volar-ir-passes = { workspace = true }
volar-lir = { workspace = true }
volar-lir-codegen = {git = "https://github.com/portal-co/volar.git"}
volar-c-backend = { workspace = true }
vaffle.workspace = true
portal-pc-waffle-ir.workspace = true
volar-net = { workspace = true, optional = true }

[dev-dependencies]
# Cross-check the `emit_keccak256` boolean gadget against a known-good SHA3-256.
sha3.workspace = true
digest = { version = "0.11.2", default-features = false }
volar-ir-virt = { workspace = true }