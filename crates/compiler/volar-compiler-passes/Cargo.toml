[package]
name = "volar-compiler-passes"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["volar-compiler/std"]
parsing = ["volar-compiler/parsing", "dep:syn", "dep:quote"]

[[bin]]
name = "volar-codegen"
path = "src/bin/volar_codegen.rs"
required-features = ["parsing"]

[dependencies]
volar-compiler = { git = "https://github.com/portal-co/volar.git" }
thiserror = "1.0"
# syn is needed by the volar-codegen binary's parse-time @volar-allow-vec
# exemption scan; it is only used behind the `parsing` feature.
syn = { version = "2.0", features = ["full", "parsing", "extra-traits", "visit"], optional = true }
quote = { version = "1.0", optional = true }

[dev-dependencies]
volar-compiler = { git = "https://github.com/portal-co/volar.git", features = ["parsing"] }
volar-compiler-passes = { git = "https://github.com/portal-co/volar.git", features = ["parsing"] }
