[package]
name = "volar-build"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
default          = ["cargo-directives"]
cargo-directives = []
weave-rust       = ["dep:volar-ir", "dep:volar-weaver"]
weave-net        = ["weave-rust", "volar-weaver/net"]
weave-chunked    = ["weave-rust", "dep:volar-compiler", "dep:volar-compiler-passes"]
weave-ts         = ["weave-rust", "dep:volar-compiler", "dep:volar-compiler-passes"]
pipeline         = ["dep:volar-ir", "dep:volar-ir-build"]
pipeline-vaffle  = ["pipeline", "volar-ir-build/vaffle"]
pipeline-wasm    = ["pipeline-vaffle", "volar-ir-build/wasm"]
pipeline-llvm    = ["pipeline-vaffle", "volar-ir-build/llvm"]
pipeline-cc      = ["pipeline-llvm", "volar-ir-build/cc", "dep:cc"]

[dependencies]
volar-lir-saved = { workspace = true, features = ["rkyv"] }
volar-llvm-backend = { workspace = true }
volar-lir = { workspace = true }
inkwell = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck"] }
volar-ir              = { workspace = true, features = ["rkyv"], optional = true }
volar-ir-build        = { workspace = true, optional = true }
cc                    = { version = "1.2", optional = true }
volar-weaver          = { path = "../volar-weaver", optional = true }
volar-compiler        = { path = "../volar-compiler", optional = true }
volar-compiler-passes = { path = "../volar-compiler-passes", optional = true }

[dev-dependencies]
wat = "1.212.0"
vaffle = { workspace = true }
volar-ir-common = { workspace = true }
tempfile = "3"

[[test]]
name = "pipeline_smoke"
required-features = ["pipeline-wasm"]

[[test]]
name = "pipeline_chunked_smoke"
required-features = ["pipeline-vaffle"]
