[package]
name = "volar-vaffle-target"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
vaffle.workspace = true
volar-ir.workspace = true
volar-ir-common.workspace = true
volar-side.workspace = true
volar-lir.workspace = true
portal-pc-waffle-ir.workspace = true
portal-pc-waffle-frontend.workspace = true
wax-meta.workspace = true
portal-lazy-transform = { path = "../../../../portal-lazy-transform", optional = true }

[features]
# Opt-in lazy VAFFLE-to-IR entry point built on portal-lazy-transform. Off by
# default: with this feature disabled, lower_vaffle_to_ir is unchanged and no
# new dependency is compiled in.
lazy-ir-plan = ["dep:portal-lazy-transform"]

[dev-dependencies]
volar-lir-test-corpus = { workspace = true }
