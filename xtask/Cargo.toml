[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Build task runner for the volar workspace"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
volar-compiler = { git = "https://github.com/portal-co/volar.git", features = ["parsing", "std"] }
volar-compiler-passes = { git = "https://github.com/portal-co/volar.git" }
