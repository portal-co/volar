[workspace]
members = [
    "crates/spec/volar-spec",
    "crates/spec/volar-primitives",
    "crates/spec/volar-common",
    "crates/spec/volar-dyn",
    "crates/spec/volar-spec-dyn",
    "crates/ir/volar-ir-lir-target",
    "crates/compiler/volar-compiler",
    "crates/compiler/volar-compiler-passes",
    "crates/compiler/ephemera",
    "crates/compiler/volar-compiler-common",
    "crates/ir/volar-discipline",
    "crates/compiler/volar-weaver",
    "crates/compiler/volar-lir-codegen",
    "crates/compiler/volar-c-backend",
    "crates/compiler/volar-llvm-backend",
    "crates/compiler/volar-wasm-backend",
    "crates/compiler/volar-build",
    "crates/channel/volar-channel",
    "crates/oram/volar-oram",
    "crates/oram/volar-oram-core",
    "crates/macros/volar-macros",
    "crates/net/volar-net",
    "crates/fold/volar-fold",
    "crates/fold/volar-verifier-fold",
    "crates/iop/volar-iop",
    "crates/iop/volar-verifier-iop-runtime",
    "crates/tools/volar-ir-tester",
    "crates/helper/volar-log",
    "crates/examples/volar-riscv-e2e",
    "xtask",
]
default-members = [
    "crates/spec/volar-spec",
    "crates/spec/volar-primitives",
    "crates/spec/volar-common",
    "crates/spec/volar-dyn",
    "crates/spec/volar-spec-dyn",
    "crates/ir/volar-ir-lir-target",
    "crates/compiler/volar-compiler",
    "crates/compiler/volar-compiler-passes",
    "crates/compiler/ephemera",
    "crates/compiler/volar-compiler-common",
    "crates/ir/volar-discipline",
    "crates/compiler/volar-weaver",
    "crates/compiler/volar-lir-codegen",
    "crates/compiler/volar-c-backend",
    "crates/compiler/volar-llvm-backend",
    "crates/compiler/volar-wasm-backend",
    "crates/compiler/volar-build",
    "crates/channel/volar-channel",
    "crates/oram/volar-oram",
    "crates/oram/volar-oram-core",
    "crates/macros/volar-macros",
    "crates/net/volar-net",
    "crates/helper/volar-log",
]
resolver = "3"

[workspace.package]
license = "CC0-1.0 AND MIT AND Apache-2.0"
description = "VOLE-in-the-head computations for a cloud world"
repository = "https://github.com/portal-co/volar.git"
[workspace.dependencies]
volar-discipline = {path="crates/ir/volar-discipline", version = "0.1.0"}
volar-channel = {path="crates/channel/volar-channel", version = "0.1.0"}
volar-oram = {path="crates/oram/volar-oram", version = "0.1.0"}
volar-oram-core = {path="crates/oram/volar-oram-core", version = "0.1.0"}
volar-macros = {path="crates/macros/volar-macros", version = "0.1.0"}
volar-net = {path="crates/net/volar-net", version = "0.1.0"}
volar-compiler-passes = {path="crates/compiler/volar-compiler-passes", version = "0.1.0"}
volar-lir-test-corpus = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-lir-saved = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-wasm-backend = {path="crates/compiler/volar-wasm-backend", version = "0.1.0"}
volar-build = {path="crates/compiler/volar-build", version = "0.1.0"}

volar-ir-config        = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-ir               = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-ir-passes        = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-lir               = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-lir-text          = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-ir-text           = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
vaffle                  = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-vaffle-target     = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-ir-common         = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-provenance        = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-side              = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-ir-opt            = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-ir-virt           = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-fuzz              = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }

portal-pc-waffle-ir = { version = "0.6.0-alpha.1", git = "https://github.com/portal-co/waffle-" }
portal-pc-waffle-frontend = { version = "0.6.0-alpha.1", git = "https://github.com/portal-co/waffle-" }
wax-meta = { version = "0.1.0", git = "https://github.com/portal-co/wax.git" }

digest = { version = "0.11.2", default-features = false }
sha3 = { version = "0.11.0-rc.2", default-features = false }
cipher = { version = "0.5.1", default-features = false }
rand = { version = "0.9.2", default-features = false }
typenum = { version = "1.17", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["alloc"] }
hybrid-array = { version = "0.4.8", default-features = false }
elliptic-curve = { version = "0.13.8", default-features = false }
ff = { version = "0.13.1", default-features = false }
group = { version = "0.13.0", default-features = false }

inkwell = { version = "0.8.0", features = [
    "llvm20-1",
] } # TODO: remove hardcoded LLVM version (currently llvm@20)
