[package]
name = "volar-fuzz-targets"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
volar-fuzz = { path = "../../volar-ir/crates/fuzz/volar-fuzz" }
volar-ir-passes = { path = "../../volar-ir/crates/ir/volar-ir-passes" }
volar-ir-opt = { path = "../../volar-ir/crates/ir/volar-ir-opt" }
volar-ir-virt = { path = "../../volar-ir/crates/ir/volar-ir-virt" }
volar-vaffle-target = { path = "../../volar-ir/crates/ir/volar-vaffle-target" }
volar-spec = { path = "../crates/spec/volar-spec" }
hybrid-array = { version = "0.4.8", default-features = false }
cipher = { version = "0.5.1", default-features = false }

# Cargo-fuzz requires a separate workspace so it does not inherit
# workspace settings from the main Cargo.toml.
[workspace]

[[bin]]
name = "fuzz_vole_circuit_completeness"
path = "fuzz_targets/fuzz_vole_circuit_completeness.rs"
test = false
doc = false
