[package]
name = "volar-fuzz-targets"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
volar-fuzz = { git = "https://github.com/portal-co/volar-ir" }
volar-ir-passes = { git = "https://github.com/portal-co/volar-ir" }
volar-ir-opt = { git = "https://github.com/portal-co/volar-ir" }
volar-ir-virt = { git = "https://github.com/portal-co/volar-ir" }
volar-vaffle-target = { git = "https://github.com/portal-co/volar-ir" }
volar-spec = { git = "https://github.com/portal-co/volar.git" }
hybrid-array = { version = "0.4.8", default-features = false }
cipher = { version = "0.5.1", default-features = false }

# Cargo-fuzz requires a separate workspace so it does not inherit
# workspace settings from the main Cargo.toml.
[workspace]

[[bin]]
name = "fuzz_vole_circuit_completeness"
path = "fuzz_targets/fuzz_vole_circuit_completeness.rs"
test = false
doc = false
